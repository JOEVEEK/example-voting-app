name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: docker compose up -d --build --wait

      - name: Smoke test (cast a vote, check it reaches the database)
        run: |
          curl -fsS http://localhost:8080 > /dev/null
          curl -fsS http://localhost:8081 > /dev/null
          curl -fsS -X POST -d "vote=a" http://localhost:8080 > /dev/null
          for i in $(seq 1 30); do
            count=$(docker compose exec -T db psql -U postgres -tAc "select count(*) from votes" 2>/dev/null || echo 0)
            if [ "${count:-0}" -ge 1 ]; then echo "vote stored"; exit 0; fi
            sleep 2
          done
          echo "vote was never stored"
          docker compose logs
          exit 1

      - name: Tear down
        if: always()
        run: docker compose down -v

  build-scan-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: vote
            target: final
          - service: result
            target: ""
          - service: worker
            target: ""
    steps:
      - uses: actions/checkout@v4

      # Registry paths must be lowercase, and your GitHub username is not
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/voting-${{ matrix.service }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Build (not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          target: ${{ matrix.target }}
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0  
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}